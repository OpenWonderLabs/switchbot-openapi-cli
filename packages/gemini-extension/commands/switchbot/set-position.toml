description = "Set a Curtain, Roller Shade, or Blind Tilt position using its device-specific format"
prompt = """
Set the position of the SwitchBot Curtain, Blind Tilt, or Roller Shade the user names.
Resolve the device name to a deviceId (alias → exact → prefix → substring → fuzzy). Verify
the device supports "setPosition" via describe_device. This is a mutation-tier command.

For Curtain/Curtain 3, position is 0=open and 100=closed; send the string "0,ff,<position>".
For Roller Shade, use the scalar string "<position>", also 0=open and 100=closed.
For Blind Tilt, ask for up/down direction and the opening percentage when ambiguous:
0=closed and 100=open, in multiples of 2. Send "<up|down>;<angle>", never a scalar.
Use the send_command MCP tool with command "setPosition" and the matching parameter.
Report the result.
User input: {{args}}
"""
