name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — record candidate outcomes without publishing'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run verify:release-gate
      - run: npm run verify:release

      - name: Verify tag matches root CLI package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match root package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Resolve release versions
        id: versions
        run: |
          {
            echo "cli=$(node -p \"require('./package.json').version\")"
            echo "codex=$(node -p \"require('./packages/codex-plugin/package.json').version\")"
            echo "openclaw=$(node -p \"require('./packages/openclaw-skill/package.json').version\")"
            echo "claude=$(node -p \"require('./packages/claude-code-plugin/package.json').version\")"
            echo "gemini=$(node -p \"require('./packages/gemini-extension/package.json').version\")"
          } >> "$GITHUB_OUTPUT"

      - name: Initialize release candidate outcomes
        run: node scripts/release-candidate.mjs init --outcomes "$RUNNER_TEMP/release-candidate-outcomes.json" --expected "@switchbot/openapi-cli@${{ steps.versions.outputs.cli }},@switchbot/codex-plugin@${{ steps.versions.outputs.codex }},@switchbot/openclaw-skill@${{ steps.versions.outputs.openclaw }},@switchbot/claude-code-plugin@${{ steps.versions.outputs.claude }},@switchbot/gemini-extension@${{ steps.versions.outputs.gemini }}"

      - name: Detect root CLI candidate
        id: detect_root
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.versions.outputs.cli }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/release-candidate.mjs probe --outcomes "$RUNNER_TEMP/release-candidate-outcomes.json" --package @switchbot/openapi-cli --version "$VERSION" "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Detect Codex plugin candidate
        id: detect_codex
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.versions.outputs.codex }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/release-candidate.mjs probe --outcomes "$RUNNER_TEMP/release-candidate-outcomes.json" --package @switchbot/codex-plugin --version "$VERSION" "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Detect OpenClaw plugin candidate
        id: detect_openclaw
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.versions.outputs.openclaw }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/release-candidate.mjs probe --outcomes "$RUNNER_TEMP/release-candidate-outcomes.json" --package @switchbot/openclaw-skill --version "$VERSION" "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Detect Claude Code plugin candidate
        id: detect_claude
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.versions.outputs.claude }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/release-candidate.mjs probe --outcomes "$RUNNER_TEMP/release-candidate-outcomes.json" --package @switchbot/claude-code-plugin --version "$VERSION" "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Detect Gemini extension candidate
        id: detect_gemini
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.versions.outputs.gemini }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/release-candidate.mjs probe --outcomes "$RUNNER_TEMP/release-candidate-outcomes.json" --package @switchbot/gemini-extension --version "$VERSION" "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Verify plugin tarball peer dependencies
        run: |
          for package in @switchbot/codex-plugin @switchbot/openclaw-skill @switchbot/claude-code-plugin @switchbot/gemini-extension; do
            tarball=$(npm pack -w "$package" --pack-destination "$RUNNER_TEMP" 2>&1 | tail -1)
            peer=$(tar -xOzf "$RUNNER_TEMP/$tarball" package/package.json | node -e "const p = JSON.parse(require('fs').readFileSync(0, 'utf8')); console.log(p.peerDependencies?.['@switchbot/openapi-cli'] || '');")
            rm -f "$RUNNER_TEMP/$tarball"
            if [ -z "$peer" ] || echo "$peer" | grep -q 'workspace:'; then
              echo "FAIL: $package peerDependency is missing or contains workspace:*: $peer"
              exit 1
            fi
          done

      - name: Publish root CLI to npm
        id: publish_root
        if: steps.detect_root.outputs.publish == 'true' && inputs.dry_run != true
        continue-on-error: true
        run: npm publish --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Codex plugin to npm
        id: publish_codex
        if: steps.detect_codex.outputs.publish == 'true' && inputs.dry_run != true
        continue-on-error: true
        run: npm publish -w @switchbot/codex-plugin --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish OpenClaw plugin to npm
        id: publish_openclaw
        if: steps.detect_openclaw.outputs.publish == 'true' && inputs.dry_run != true
        continue-on-error: true
        run: npm publish -w @switchbot/openclaw-skill --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Claude Code plugin to npm
        id: publish_claude
        if: steps.detect_claude.outputs.publish == 'true' && inputs.dry_run != true
        continue-on-error: true
        run: npm publish -w @switchbot/claude-code-plugin --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Gemini extension to npm
        id: publish_gemini
        if: steps.detect_gemini.outputs.publish == 'true' && inputs.dry_run != true
        continue-on-error: true
        run: npm publish -w @switchbot/gemini-extension --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Record publication outcomes
        if: always() && inputs.dry_run != true
        env:
          ROOT_PUBLISH: ${{ steps.detect_root.outputs.publish }}
          ROOT_OUTCOME: ${{ steps.publish_root.outcome }}
          CODEX_PUBLISH: ${{ steps.detect_codex.outputs.publish }}
          CODEX_OUTCOME: ${{ steps.publish_codex.outcome }}
          OPENCLAW_PUBLISH: ${{ steps.detect_openclaw.outputs.publish }}
          OPENCLAW_OUTCOME: ${{ steps.publish_openclaw.outcome }}
          CLAUDE_PUBLISH: ${{ steps.detect_claude.outputs.publish }}
          CLAUDE_OUTCOME: ${{ steps.publish_claude.outcome }}
          GEMINI_PUBLISH: ${{ steps.detect_gemini.outputs.publish }}
          GEMINI_OUTCOME: ${{ steps.publish_gemini.outcome }}
          CLI_VERSION: ${{ steps.versions.outputs.cli }}
          CODEX_VERSION: ${{ steps.versions.outputs.codex }}
          OPENCLAW_VERSION: ${{ steps.versions.outputs.openclaw }}
          CLAUDE_VERSION: ${{ steps.versions.outputs.claude }}
          GEMINI_VERSION: ${{ steps.versions.outputs.gemini }}
        run: |
          record() {
            if [ "$1" = true ]; then
              outcome=failed
              if [ "$2" = success ]; then outcome=published; fi
              node scripts/release-candidate.mjs record --outcomes "$RUNNER_TEMP/release-candidate-outcomes.json" --package "$3" --version "$4" --outcome "$outcome"
            fi
          }
          record "$ROOT_PUBLISH" "$ROOT_OUTCOME" @switchbot/openapi-cli "$CLI_VERSION"
          record "$CODEX_PUBLISH" "$CODEX_OUTCOME" @switchbot/codex-plugin "$CODEX_VERSION"
          record "$OPENCLAW_PUBLISH" "$OPENCLAW_OUTCOME" @switchbot/openclaw-skill "$OPENCLAW_VERSION"
          record "$CLAUDE_PUBLISH" "$CLAUDE_OUTCOME" @switchbot/claude-code-plugin "$CLAUDE_VERSION"
          record "$GEMINI_PUBLISH" "$GEMINI_OUTCOME" @switchbot/gemini-extension "$GEMINI_VERSION"

      - name: Upload release candidate outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-outcomes
          path: ${{ runner.temp }}/release-candidate-outcomes.json
          if-no-files-found: error

      - name: Require a complete publishable candidate
        if: always()
        run: node scripts/release-candidate.mjs assert-outcomes --outcomes "$RUNNER_TEMP/release-candidate-outcomes.json"
