name: npm published smoke

on:
  workflow_run:
    workflows: ['Publish to npm']
    types: [completed]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to verify (defaults: matrix runs all release packages)'
        required: false
      version:
        description: 'Exact published version to verify'
        required: false

jobs:
  source:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.release_source.outputs.revision || steps.manual_source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Download authoritative candidate source
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-outcomes
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable release source
        if: github.event_name == 'workflow_run'
        id: release_source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/resolve-release-source.mjs --outcomes "$RUNNER_TEMP/release-candidate/release-candidate-outcomes.json" >> "$GITHUB_OUTPUT"
      - name: Select direct manual smoke source
        if: github.event_name == 'workflow_dispatch'
        id: manual_source
        run: echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  smoke:
    needs: source
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: '@switchbot/openapi-cli'
            version_path: 'package.json'
            kind: cli
          - package: '@switchbot/codex-plugin'
            version_path: 'packages/codex-plugin/package.json'
            kind: plugin
          - package: '@switchbot/openclaw-skill'
            version_path: 'packages/openclaw-skill/package.json'
            kind: plugin
          - package: '@switchbot/claude-code-plugin'
            version_path: 'packages/claude-code-plugin/package.json'
            kind: plugin
          - package: '@switchbot/gemini-extension'
            version_path: 'packages/gemini-extension/package.json'
            kind: plugin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - name: Download authoritative candidate outcomes
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-outcomes
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve candidate outcome
        id: candidate
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION_PATH: ${{ matrix.version_path }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(node -p "require('./$VERSION_PATH').version")
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            if [ -n "$INPUT_PACKAGE" ] && [ "$INPUT_PACKAGE" != "$PACKAGE" ]; then
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$INPUT_VERSION" ]; then VERSION="$INPUT_VERSION"; fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo 'skip=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/release-candidate.mjs candidate --outcomes "$RUNNER_TEMP/release-candidate/release-candidate-outcomes.json" --package "$PACKAGE" --version "$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify npm token present
        if: steps.candidate.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo 'NPM_TOKEN is required for release verification'
            exit 1
          fi


      - name: Verify exact npm candidate is available
        if: steps.candidate.outputs.skip != 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          for attempt in $(seq 1 24); do
            found=$(npm view "${PACKAGE}@${VERSION}" version 2>/dev/null || true)
            if [ "$found" = "$VERSION" ]; then
              echo "Exact candidate is available: ${PACKAGE}@${VERSION}"
              exit 0
            fi
            echo "Waiting for exact candidate ${PACKAGE}@${VERSION} ($attempt/24)"
            sleep 10
          done
          echo "Exact candidate did not become available: ${PACKAGE}@${VERSION}"
          exit 1

      - name: Install exact candidate in a clean project
        if: steps.candidate.outputs.skip != 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          TEMP_PROJECT=$(mktemp -d)
          echo "TEMP_PROJECT=$TEMP_PROJECT" >> "$GITHUB_ENV"
          cd "$TEMP_PROJECT"
          npm init -y >/dev/null 2>&1
          npm install "${PACKAGE}@${VERSION}"

      - name: Offline CLI artifact gate
        if: matrix.kind == 'cli' && steps.candidate.outputs.skip != 'true'
        env:
          TEMP_PROJECT: ${{ env.TEMP_PROJECT }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          cd "$TEMP_PROJECT"
          test "$(npx --no-install switchbot --version)" = "$VERSION"
          npx --no-install switchbot --help >/dev/null
          npx --no-install switchbot schema export --compact >/dev/null
          npx --no-install switchbot capabilities --json | jq -e '.data.commandMeta != null' >/dev/null


      - name: Plugin artifact gate
        if: matrix.kind == 'plugin' && steps.candidate.outputs.skip != 'true'
        env:
          TEMP_PROJECT: ${{ env.TEMP_PROJECT }}
          PACKAGE: ${{ matrix.package }}
        run: |
          manifest="$TEMP_PROJECT/node_modules/$PACKAGE/package.json"
          test -f "$manifest"
          peer=$(node -p "require('$manifest').peerDependencies?.['@switchbot/openapi-cli'] || ''")
          if [ -z "$peer" ] || echo "$peer" | grep -q 'workspace:'; then
            echo "Invalid published peer dependency for $PACKAGE: $peer"
            exit 1
          fi

      - name: Remove temporary project
        if: always()
        env:
          TEMP_PROJECT: ${{ env.TEMP_PROJECT }}
        run: |
          if [ -n "$TEMP_PROJECT" ] && [ -d "$TEMP_PROJECT" ]; then rm -rf "$TEMP_PROJECT"; fi

  required-hosts:
    if: >
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'workflow_dispatch')
    needs: [source, smoke]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Install pinned release hosts
        run: npm install --global @openai/codex@0.162.1 @anthropic-ai/claude-code@2.1.238 @google/gemini-cli@0.44.1 openclaw@2026.10.2
      - name: Download authoritative candidate outcomes
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-outcomes
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all required hosts load exact published candidates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run smoke:release-host -- --outcomes "$RUNNER_TEMP/release-candidate/release-candidate-outcomes.json" --require-host --evidence "$RUNNER_TEMP/release-host-evidence.json"
      - name: Upload required host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-host-evidence
          path: ${{ runner.temp }}/release-host-evidence.json
          if-no-files-found: error

  promote:
    if: >
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'workflow_dispatch')
    needs: [source, smoke, required-hosts]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
      - name: Download authoritative candidate outcomes
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-outcomes
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download required host evidence
        uses: actions/download-artifact@v4
        with:
          name: release-host-evidence
          path: ${{ runner.temp }}/release-host
      - name: Mark completed artifact and local readonly host gates
        run: node scripts/release-candidate.mjs create-gates --outcomes "$RUNNER_TEMP/release-candidate/release-candidate-outcomes.json" --host-evidence "$RUNNER_TEMP/release-host/release-host-evidence.json" --gates "$RUNNER_TEMP/release-candidate/gates.json"
      - name: Promote verified candidates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-candidate.mjs promote --outcomes "$RUNNER_TEMP/release-candidate/release-candidate-outcomes.json" --gates "$RUNNER_TEMP/release-candidate/gates.json"
