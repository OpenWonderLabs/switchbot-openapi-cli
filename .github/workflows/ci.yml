name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions schema lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check check-jsonschema==0.39.0
      - run: check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml

  docs-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run lint:md

  test:
    runs-on: ubuntu-latest
    needs: [docs-lint, workflow-lint]
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: CLI --version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          CLI=$(node dist/index.js --version)
          if [ "$PKG" != "$CLI" ]; then
            echo "Version drift: package.json=$PKG, CLI=$CLI"
            exit 1
          fi
      - run: npm test
        if: matrix.node-version != '24.x'
      - run: npm run test:coverage
        if: matrix.node-version == '24.x'
      - name: Upload coverage report
        if: always() && matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: cli-coverage
          path: coverage/
          if-no-files-found: error
      - run: npm run test:workspaces

  openclaw-bootstrap:
    name: OpenClaw native bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [docs-lint, workflow-lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Exercise packed peer outside plugin ancestry
        run: npm run smoke:openclaw-bootstrap -- --evidence "${{ runner.temp }}/openclaw-bootstrap.json"
      - name: Upload native bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-bootstrap-${{ matrix.os }}
          path: ${{ runner.temp }}/openclaw-bootstrap.json
          if-no-files-found: error

  bundle-smoke:
    name: esbuild bundle smoke test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Shebang count must be exactly 1
        run: |
          COUNT=$(grep -c "#!/usr/bin/env node" dist/index.js)
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: Expected 1 shebang, found $COUNT"
            exit 1
          fi
          echo "OK: shebang count = $COUNT"
      - name: Node.js syntax check
        run: node --check dist/index.js
      - name: --version smoke test (exits 0, outputs correct semver)
        run: |
          PKG=$(node -p "require('./package.json').version")
          CLI=$(node dist/index.js --version)
          echo "package.json=$PKG  bundle=$CLI"
          if [ "$PKG" != "$CLI" ]; then
            echo "FAIL: version mismatch"
            exit 1
          fi
      - name: Bundle size check
        run: npm test -- tests/build/

  offline-smoke:
    name: Offline size budgets
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check offline discovery budgets on cold and populated caches
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/discovery-home"
          mkdir -p "$HOME"
          output="$RUNNER_TEMP/discovery.json"
          check_budget() {
            local limit=$1
            shift
            node dist/index.js "$@" > "$output"
            local bytes
            bytes=$(wc -c < "$output")
            echo "$* = $bytes bytes (limit: $limit)"
            test "$bytes" -lt "$limit"
          }
          check_budget 20000 agent-bootstrap --compact
          jq -e '(.data.devices | length) == 0 and .data.catalog == {"scope":"used","types":[]}' "$output"
          mkdir -p "$HOME/.switchbot"
          cat > "$HOME/.switchbot/devices.json" <<'JSON'
          {
            "lastUpdated": "2026-04-20T00:00:00.000Z",
            "devices": {
              "BOT001":    { "type": "Bot",           "name": "Test Bot",   "category": "physical" },
              "METER001":  { "type": "Meter",         "name": "Test Meter", "category": "physical" },
              "STRIP001":  { "type": "Strip Light 3", "name": "Test Strip", "category": "physical" },
              "IRTV001":   { "type": "TV",            "name": "Test TV",    "category": "ir" }
            }
          }
          JSON
          check_budget 20000 agent-bootstrap --compact
          # Evaluate the jq expressions advertised to users, not copies of them.
          mapfile -t projections < <(node dist/index.js agent-bootstrap --help | sed -n "s/.*| jq '\\([^']*\\)'.*/\\1/p")
          test "${#projections[@]}" -eq 2
          test "$(jq -e "${projections[0]}" "$output")" -eq 4
          jq -e "${projections[1]} | .discovery | length > 0" "$output"
          check_budget 15000 schema export --compact --used
          check_budget 15000 schema export --type S30
          jq -e '[.data.resources.webhooks.events[].context.deviceType] == ["Robot Vacuum Cleaner S30"]' "$output"
      - name: Evaluate isolated household decisions
        run: node scripts/household-eval.mjs > "$RUNNER_TEMP/household-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: household-contract-report
          path: ${{ runner.temp }}/household-report.json
          if-no-files-found: ignore

  pack-install-smoke:
    name: Packed install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: npm pack -> npm install tarball -> switchbot --version / policy new / policy validate
        run: npm run smoke:pack-install

  codex-release-gates:
    name: Codex release gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run verify:release-gate

  claude-code-release-gates:
    name: Claude Code release gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:claude-code-pack-install

  gemini-release-gates:
    name: Gemini extension release gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:gemini-extension-lint
      - name: Workspace tests
        run: cd packages/gemini-extension && node --test
